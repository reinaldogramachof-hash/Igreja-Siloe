<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Gestão Siloé</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem;
      text-align: center;
      gap: 1.5rem;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(13, 148, 136, 0.4);
      box-shadow: 0 0 30px rgba(13, 148, 136, 0.2);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(13, 148, 136, 0.12);
      border: 1px solid rgba(13, 148, 136, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      color: #0d9488;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.9375rem;
      color: #94a3b8;
      max-width: 340px;
      line-height: 1.6;
    }

    button {
      margin-top: 0.5rem;
      padding: 0.625rem 1.75rem;
      border-radius: 12px;
      background: #0d9488;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
    }

    button:hover { background: #0f766e; }
    button:active { transform: scale(0.97); }

    .status {
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/icons/icon-192x192.png" alt="Siloé" />
  </div>

  <div class="icon-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3.75 6.75h16.5M3.75 12H12m-8.25 5.25h16.5M18 15.75l-3-3 3-3" />
    </svg>
  </div>

  <div>
    <h1>Sem conexão</h1>
    <p style="margin-top: 0.5rem;">
      Você está offline. Verifique sua conexão com a internet e tente novamente.
    </p>
  </div>

  <button onclick="window.location.reload()">
    Tentar novamente
  </button>

  <p class="status">Gestão Siloé · Sistema Ministerial</p>
</body>
</html>
